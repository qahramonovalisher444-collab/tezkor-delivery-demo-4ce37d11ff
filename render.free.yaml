previews:
  generation: "off"

services:
  - type: web
    name: tezkor-delivery-free-web
    runtime: docker
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    dockerContext: ./tezkor-delivery
    dockerfilePath: ./tezkor-delivery/Dockerfile.render
    dockerCommand: python free_entrypoint.py
    healthCheckPath: /api/ready/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.free
      - key: DJANGO_DEBUG
        value: "false"
      - key: ENABLE_DEMO_AUTH
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: tezkor-delivery-free-db
          property: connectionString
      - key: WEBAPP_URL
        fromService:
          name: tezkor-delivery-free-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: DELIVERY_FEE
        value: "10000"

databases:
  - name: tezkor-delivery-free-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    databaseName: tezkor
    user: tezkor
    ipAllowList: []
