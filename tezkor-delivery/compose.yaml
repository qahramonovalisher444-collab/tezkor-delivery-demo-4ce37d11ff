services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tezkor
      POSTGRES_USER: tezkor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni belgilang}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tezkor"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://tezkor:${POSTGRES_PASSWORD}@db:5432/tezkor
    volumes:
      - django_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - django_static:/backend-static:ro
    depends_on:
      - backend
    restart: unless-stopped
  notifications:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://tezkor:${POSTGRES_PASSWORD}@db:5432/tezkor
    command: ["python", "manage.py", "process_notifications"]
    depends_on:
      - backend
    restart: unless-stopped
  bot:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://tezkor:${POSTGRES_PASSWORD}@db:5432/tezkor
    command: ["python", "manage.py", "runbot"]
    profiles: ["telegram"]
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
  django_static:
